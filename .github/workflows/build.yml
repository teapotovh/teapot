name: Publish Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCI images
        run: |
          targets=$(bazel query 'filter(":push$", kind("image_push", //...))')
          bazel build $targets

      - name: Push OCI images
        run: |
          bazel cquery 'filter(":push$", kind("image_push", //...))' --output=files |
            sed 's|^|./|' |
            xargs -P "$(nproc)" -n 1

  release-branch:
    name: Release Branch
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Create release branch
        run: bazel run //tools:releasebranch
