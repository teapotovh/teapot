name: Lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  golangci:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Restore golangci-lint cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('go.mod', 'go.sum', '.golangci.yaml', 'bazel/multitool.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-golangci-lint-

      - name: Lint
        run: bazel run //tools:golangci-lint -- run

      - name: Save golangci-lint cache
        if: always() && github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/golangci-lint
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('go.mod', 'go.sum', '.golangci.yaml', 'bazel/multitool.lock.json') }}
