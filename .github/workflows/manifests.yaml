name: Manifests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}

      - name: Check changes
        id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ -z "${BASE}" ]]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "changed=$(bazel run //tools:affected -- matches --base "${BASE}" --filter manifests)" >> "${GITHUB_OUTPUT}"

      - name: Check manifests
        if: steps.changes.outputs.changed == 'true'
        run: bazel run //tools:manifestcheck
