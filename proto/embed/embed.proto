syntax = "proto3";

package embed;
option go_package = "github.com/teapotovh/teapot/proto/embed;embed";

// Embedder provides RPC calls to generate embeddings from text input.
service Embedder {
  // Embed takes a long set of sentences and returns its embedding computed 
  // according to the model.
  // The input shall be passages from the corpus where search is meant to be performed.
  rpc EmbedPassage (EmbedPassageRequest) returns (EmbedPassageResponse) {}

  // Embed takes a short (set of) sentence(s) and returns its embedding computed 
  // according to the selected model.
  // The input shall be the query to run on the corpus.
  rpc EmbedQuery (EmbedQueryRequest) returns (EmbedQueryResponse) {}
}

// Embedding represents an embedding vector for a chunk of text
message Embedding {
  repeated float vector = 1;
  string text = 2;
}

// EmbedPassageRequest carries the request to run the embedding model on a long passage 
// corpus, creating n embeddings based on the configured chunking (with overlap).
message EmbedPassageRequest {
  string text = 1;
}

// EmbedPassageResponse contains the generated embeddings.
message EmbedPassageResponse {
  repeated Embedding embeddings = 1;
}

// EmbedQueryRequest carries the request to run the embedding model on a short
// retrieval query to generate a single embedding.
message EmbedQueryRequest {
  string text = 1;
}

// EmbedQueryResponse contains the generated embedding for the query text.
message EmbedQueryResponse {
  Embedding embedding = 1;
}
