apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mail-storage
spec:
  interval: 1h
  path: deploy/app/mail/storage
  prune: true
  dependsOn:
  - name: postgresql01
  sourceRef:
    kind: GitRepository
    name: teapot
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mail
spec:
  interval: 1h
  path: deploy/app/mail
  prune: true
  dependsOn:
  - name: app
  - name: external-dns-crd
  - name: mail-storage
  - name: garage01
  sourceRef:
    kind: GitRepository
    name: teapot
