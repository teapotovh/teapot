apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-crd
spec:
  interval: 1h
  path: deploy/infra/cert-manager/crd
  prune: true
  sourceRef:
    kind: GitRepository
    name: teapot
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
spec:
  interval: 1h
  path: deploy/infra/cert-manager
  dependsOn:
  - name: gateway-api
  - name: cert-manager-crd
  prune: true
  sourceRef:
    kind: GitRepository
    name: teapot
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager-issuers
spec:
  interval: 1h
  path: deploy/infra/cert-manager/issuers
  dependsOn:
  - name: cert-manager-crd
  prune: true
  sourceRef:
    kind: GitRepository
    name: teapot
