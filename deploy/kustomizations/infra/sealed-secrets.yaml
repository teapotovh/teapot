apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sealed-secrets-crd
spec:
  interval: 1h
  path: deploy/infra/sealed-secrets/crd
  prune: true
  sourceRef:
    kind: GitRepository
    name: teapot
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sealed-secrets
spec:
  interval: 1h
  path: deploy/infra/sealed-secrets
  prune: true
  dependsOn:
  - name: sealed-secrets-crd
  sourceRef:
    kind: GitRepository
    name: teapot
