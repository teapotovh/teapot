apiVersion: apps/v1
kind: Deployment
metadata:
  name: filter
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels: {}
      containers:
      - name: openarc
        image: ghcr.io/teapotovh/openarc:v0.0.16
        ports:
        - name: milter
          containerPort: 8893
        volumeMounts:
        - name: config
          mountPath: /etc/openarc.conf
          subPath: openarc.conf
          readOnly: true
        - name: keys
          mountPath: /etc/openarc/keys
          readOnly: true
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 50m
            memory: 64Mi
      volumes:
      - name: config
        configMap:
          name: config
      - name: keys
        secret:
          secretName: mail-arc-keys
