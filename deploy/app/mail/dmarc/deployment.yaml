apiVersion: apps/v1
kind: Deployment
metadata:
  name: filter
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels: {}
      containers:
        - name: opendmarc
          image: mirror.gcr.io/instrumentisto/opendmarc:1.4-alpine
          ports:
            - name: milter
              containerPort: 8893
          volumeMounts:
            - name: config
              mountPath: /etc/opendmarc
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: config
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.43.0.53
