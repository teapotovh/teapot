apiVersion: v1
kind: Service
metadata:
  name: server
  annotations:
    external-dns.kubernetes.io/hostname: imap.teapot.ovh
spec:
  type: NodePort
  trafficDistribution: PreferSameNode
  externalTrafficPolicy: Local
  ports:
  - name: imaps
    port: 993
    nodePort: 30993
    targetPort: imaps
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: lmtp
spec:
  ports:
  - name: lmtp
    port: 24
    targetPort: lmtp
    protocol: TCP
