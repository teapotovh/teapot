apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cluster
spec:
  instances: 3
  postgresql:
    parameters:
      max_connections: "500"
      wal_sender_timeout: "60s"
      wal_receiver_timeout: "60s"
  storage:
    pvcTemplate:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 32Gi
      storageClassName: local-path-storageclass
      volumeMode: Filesystem
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi
  managed:
    roles:
      - name: bottin
        ensure: present
        comment: Access user for the bottin db
        login: true
        superuser: false
        inRoles:
          - pg_monitor
          - pg_signal_backend
        passwordSecret:
          name: postgresql01-user-bottin
      - name: mail
        ensure: present
        comment: Access user for the mail db
        login: true
        superuser: false
        inRoles:
          - pg_monitor
          - pg_signal_backend
        passwordSecret:
          name: postgresql01-user-mail
      - name: vaultwarden
        ensure: present
        comment: Access user for the vaultwarden db
        login: true
        superuser: false
        inRoles:
          - pg_monitor
          - pg_signal_backend
        passwordSecret:
          name: postgresql01-user-vaultwarden
      - name: dex
        ensure: present
        comment: Access user for the dex db
        login: true
        superuser: false
        inRoles:
          - pg_monitor
          - pg_signal_backend
        passwordSecret:
          name: postgresql01-user-dex
      - name: radicale
        ensure: present
        comment: Access user for the radicale db
        login: true
        superuser: false
        inRoles:
          - pg_monitor
          - pg_signal_backend
        passwordSecret:
          name: postgresql01-user-radicale
      - name: calendar
        ensure: present
        comment: Access user for the calendar db
        login: true
        superuser: false
        inRoles:
          - pg_monitor
          - pg_signal_backend
        passwordSecret:
          name: postgresql01-user-calendar
